<svg xmlns="http://www.w3.org/2000/svg" width="1425" height="750" viewBox="0 0 1425 750"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#557e67"/></marker></defs><rect width="1425" height="750" rx="20" fill="#f7f8f2"/><g font-family="Microsoft YaHei, sans-serif"><text x="45" y="57" fill="#294438" font-size="30">拾光 · 从发布到完成的业务流程</text><text x="45" y="93" fill="#68806d" font-size="18">两类信息走同一条流程，状态文案由类型决定。</text><rect x="45" y="145" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="65" y="179" fill="#65895d" font-size="14">01  发布者</text><text x="65" y="210" fill="#294438" font-size="23">填写信息</text><text x="65" y="241" fill="#68806d" font-size="16">选择寻物 / 招领</text><text x="65" y="266" fill="#68806d" font-size="16">填写物品和联系方式</text><rect x="395" y="145" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="415" y="179" fill="#65895d" font-size="14">02  程序</text><text x="415" y="210" fill="#294438" font-size="23">校验并保存</text><text x="415" y="241" fill="#68806d" font-size="16">字段合法，写入成功</text><text x="415" y="266" fill="#68806d" font-size="16">才进入发布成功页</text><rect x="745" y="145" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="765" y="179" fill="#65895d" font-size="14">03  查看者</text><text x="765" y="210" fill="#294438" font-size="23">浏览或组合搜索</text><text x="765" y="241" fill="#68806d" font-size="16">关键词 + 分类 + 地点</text><text x="765" y="266" fill="#68806d" font-size="16">结果保留同一记录 ID</text><rect x="1095" y="145" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="1115" y="179" fill="#65895d" font-size="14">04  查看者</text><text x="1115" y="210" fill="#294438" font-size="23">详情与联系方式</text><text x="1115" y="241" fill="#68806d" font-size="16">核对描述、日期和地点</text><text x="1115" y="266" fill="#68806d" font-size="16">查看 / 复制联系账号</text><path d="M330 218H390" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M680 218H740" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1030 218H1090" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="395" y="337" width="285" height="85" rx="12" fill="#fcf0dd"/><text x="416" y="370" fill="#98662b" font-size="19">失败：给出具体提示</text><text x="416" y="401" fill="#98662b" font-size="16">保留输入，不显示发布成功</text><path d="M537 292V332" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1095" y="488" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="1115" y="522" fill="#65895d" font-size="14">05  应用外</text><text x="1115" y="553" fill="#294438" font-size="23">核对与交接</text><text x="1115" y="584" fill="#68806d" font-size="16">联系发布者并确认特征</text><text x="1115" y="609" fill="#68806d" font-size="16">实际找回 / 归还后再完成</text><rect x="745" y="488" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="765" y="522" fill="#65895d" font-size="14">06  发布者</text><text x="765" y="553" fill="#294438" font-size="23">确认更新状态</text><text x="765" y="584" fill="#68806d" font-size="16">我的发布 / 本人详情</text><text x="765" y="609" fill="#68806d" font-size="16">检查权限、进行中、确认</text><rect x="395" y="488" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="415" y="522" fill="#65895d" font-size="14">07  程序</text><text x="415" y="553" fill="#294438" font-size="23">写入完成状态</text><text x="415" y="584" fill="#68806d" font-size="16">寻物 → 已找到</text><text x="415" y="609" fill="#68806d" font-size="16">招领 → 已归还</text><rect x="45" y="488" width="285" height="146" rx="14" fill="#ffffff" stroke="#ccdbc8" stroke-width="2"/><text x="65" y="522" fill="#65895d" font-size="14">08  各入口</text><text x="65" y="553" fill="#294438" font-size="23">显示同一结果</text><text x="65" y="584" fill="#68806d" font-size="16">默认进行中列表隐藏</text><text x="65" y="609" fill="#68806d" font-size="16">全部状态与详情仍可查看</text><path d="M1238 292V482" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1095 561H1036" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745 561H686" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M395 561H336" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="766" y="375" fill="#98662b" font-size="18">取消 / 非本人 / 已完成：</text><text x="766" y="405" fill="#98662b" font-size="17">保持原记录，不越权更新。</text><path d="M888 488V431" stroke="#557e67" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="45" y="703" fill="#68806d" font-size="18">边界：本地浏览器演示；没有即时聊天、跨设备共享或真实身份认证。</text></g></svg>